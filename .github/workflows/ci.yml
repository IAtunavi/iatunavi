name: TUNAVI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed application files
        run: |
          bunx prettier --write \
            src/components/modules/ModuleWorkspace.tsx \
            src/components/hud/primitives.tsx \
            src/components/shell/Sidebar.tsx \
            src/lib/settings.ts \
            src/lib/auth.tsx \
            src/lib/ai/tunavi.server.ts \
            src/routes/index.tsx \
            src/routes/entrar.tsx \
            src/routes/super-painel.tsx \
            src/routes/meu-espaco.tsx \
            src/routes/projetos.tsx \
            src/routes/tarefas.tsx \
            src/routes/pesquisa.tsx \
            src/routes/criador.tsx \
            src/routes/agentes.tsx \
            src/routes/memoria.tsx \
            src/routes/voz.tsx \
            src/routes/integracoes.tsx \
            src/routes/desktop.tsx \
            src/routes/seguranca.tsx \
            src/routes/configuracoes.tsx
      - name: Lint changed application files
        run: |
          bunx eslint \
            src/components/modules/ModuleWorkspace.tsx \
            src/components/hud/primitives.tsx \
            src/components/shell/Sidebar.tsx \
            src/lib/settings.ts \
            src/lib/auth.tsx \
            src/lib/ai/tunavi.server.ts \
            src/routes/index.tsx \
            src/routes/entrar.tsx \
            src/routes/super-painel.tsx \
            src/routes/meu-espaco.tsx \
            src/routes/projetos.tsx \
            src/routes/tarefas.tsx \
            src/routes/pesquisa.tsx \
            src/routes/criador.tsx \
            src/routes/agentes.tsx \
            src/routes/memoria.tsx \
            src/routes/voz.tsx \
            src/routes/integracoes.tsx \
            src/routes/desktop.tsx \
            src/routes/seguranca.tsx \
            src/routes/configuracoes.tsx
      - name: Tests
        run: bun run test --passWithNoTests
      - name: Production build
        run: bun run build
